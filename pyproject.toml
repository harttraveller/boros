[project]
name = "boros"
version = "0.1.0"
description = "A metacircular Python interpreter, written in Python, that can run itself"
readme = "README.md"
authors = [
    { name = "Opus 5.5" },
    { name = "Hart Traveller", email = "24962209+harttraveller@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pyinstrument>=5.1.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]

[project.scripts]
boros = "boros.cli:run"

[tool.ruff]
line-length = 120
extend-exclude = ["tests/cases"]

[tool.ruff.lint]
# defaults (E4, E7, E9, F) plus cyclomatic complexity and annotation checks
extend-select = ["C90", "ANN"]
# Interpreted values are dynamically typed, so `Any` is the honest annotation for them.
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests", "bench"]
exclude = ["tests/cases", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
